name: Sync NEXUS Project Skills

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy NEXUS skills to project skills
        run: |
          mkdir -p .claude/skills
          cp -R plugins/nexus-godmode-studio/skills/. .claude/skills/

      - name: Commit project skills
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .claude/skills

          git commit -m "Install NEXUS skills for Claude Code project" || exit 0
          git push
