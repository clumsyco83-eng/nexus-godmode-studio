name: Unpack NEXUS Skills

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract NEXUS skill package
        run: |
          ZIP="plugins/nexus-godmode-studio/skills/nexus-godmode-master-suite-11-skills.zip"
          TEMP_DIR="$(mktemp -d)"

          unzip "$ZIP" -d "$TEMP_DIR"

          cp -R \
            "$TEMP_DIR/nexus-godmode-master-suite/skills/." \
            "plugins/nexus-godmode-studio/skills/"

          rm "$ZIP"

      - name: Commit extracted skills
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add plugins/nexus-godmode-studio/skills

          git commit -m "Install NEXUS GODMODE MASTER and core skills" || exit 0
          git push
